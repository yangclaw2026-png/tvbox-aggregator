name: Update Movie Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 抓取豆瓣主影视库
        run: |
          python fetch_movies.py

      - name: 抓取其他播放源
        run: |
          python fetch_play_sources.py

      - name: 生成首页数据
        run: |
          python generate_home.py

      - name: 生成分类数据
        run: |
          python generate_categories.py

      - name: 提交生成的数据
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Update movie data"

          git push
